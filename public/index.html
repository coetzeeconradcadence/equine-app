<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hoofnote</title>
  <meta name="description" content="Your horse's records, reminders, costs and results in one place." />
  <meta name="theme-color" content="#2f4a3a" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="welcome" class="welcome" role="dialog" aria-label="Welcome to Hoofnote">
    <!-- Hero photo: free-to-use, no attribution required (Pexels License) – swap for commissioned
         artwork or your own photography later; nothing else about this screen needs to change. -->
    <img class="welcome-bg" src="https://images.pexels.com/photos/1366913/pexels-photo-1366913.jpeg?auto=compress&cs=tinysrgb&w=1600" alt="" />
    <div class="welcome-scrim"></div>
    <img class="welcome-logo" src="icons/icon.svg" width="36" height="36" alt="" />
    <div class="welcome-content">
      <div class="welcome-eyebrow">Hoofnote</div>
      <h1>Every horse.<br>Every record.</h1>
      <p class="welcome-tag">Health, feeding, training, shows and costs — in one place.</p>
      <button id="welcome-go" class="primary block">Enter app</button>
    </div>
  </div>

  <header class="topbar">
    <a href="#/" class="brand" aria-label="Home">
      <img src="icons/icon.svg" alt="" width="28" height="28" />
      <span id="app-name">Hoofnote</span>
      <span class="badge-dev">beta</span>
    </a>
    <nav class="top-links">
      <a href="#/blog" title="Tips, training videos and stories">Blog</a>
      <a href="#/ai" title="Ask a question about a horse and get an answer from its own records">Ask AI</a>
      <a href="#/help" aria-label="Help" title="What every part of the app does">❓</a>
      <a href="#/settings" aria-label="Settings" title="Currency, backup, theme and demo data">⚙︎</a>
    </nav>
  </header>

  <div id="storage-banner" class="banner warn" hidden>
    This browser is blocking storage, so changes will be lost when you close the page. Try a normal (non-private) window.
  </div>

  <main id="view" tabindex="-1"></main>

  <nav class="bottomnav" aria-label="Main">
    <a href="#/" data-nav="home" title="Dashboard: what's due, quick stats and shortcuts"><span>🏠</span>Home</a>
    <a href="#/horses" data-nav="horses" title="All your horses and their profiles"><span>🐴</span>Horses</a>
    <a href="#/reminders" data-nav="reminders" title="Everything due soon, across every horse"><span>🔔</span>Due</a>
    <a href="#/expenses" data-nav="expenses" title="Expenses by horse or shared across the yard"><span>💰</span>Costs</a>
    <a href="#/more" data-nav="more" title="Calendar, contacts, feed, shows, help and settings"><span>☰</span>More</a>
  </nav>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
